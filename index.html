<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Il Mio Ricettario</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
        }

        /* Animazioni personalizzate */
        .animate-fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }
        
        .animate-fade-in-up {
            animation: fadeInUp 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="min-h-screen bg-orange-50 text-slate-800">

    <!-- Header -->
    <header class="bg-white shadow-sm sticky top-0 z-10 border-b border-orange-100">
        <div class="max-w-5xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-2 cursor-pointer" onclick="app.setView('list')">
                <div class="bg-orange-500 p-2 rounded-lg text-white">
                    <i data-lucide="chef-hat" width="24" height="24"></i>
                </div>
                <h1 class="text-xl font-bold text-orange-900 hidden sm:block">Il Mio Ricettario</h1>
            </div>
            
            <div id="header-actions">
                <!-- Il pulsante "Nuova Ricetta" verrà iniettato qui via JS se siamo nella view 'list' -->
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main id="app-root" class="max-w-5xl mx-auto px-4 py-6">
        <!-- Il contenuto verrà renderizzato qui dinamicamente -->
    </main>

    <script>
        // --- Dati e Stato ---
        const INITIAL_RECIPES = [
            {
                id: 1,
                name: 'Spaghetti alla Carbonara',
                category: 'Primi Piatti',
                prepTime: '20 min',
                ingredients: ['350g Spaghetti', '150g Guanciale', '4 Tuorli', '100g Pecorino Romano', 'Pepe Nero'],
                steps: [
                    'Tagliare il guanciale a listarelle e rosolarlo in padella fino a renderlo croccante.',
                    'In una ciotola, sbattere i tuorli con il pecorino e abbondante pepe nero.',
                    'Cuocere la pasta in acqua bollente salata.',
                    'Scolare la pasta al dente conservando un po\' di acqua di cottura.',
                    'Unire la pasta al guanciale (fuori dal fuoco), aggiungere la crema di uova e un po\' di acqua di cottura. Mescolare energicamente.'
                ]
            },
            {
                id: 2,
                name: 'Tiramisù Classico',
                category: 'Dolci',
                prepTime: '40 min',
                ingredients: ['500g Mascarpone', '300g Savoiardi', '4 Uova', '100g Zucchero', 'Caffè espresso', 'Cacao amaro'],
                steps: [
                    'Separare i tuorli dagli albumi. Montare i tuorli con metà zucchero.',
                    'Aggiungere il mascarpone ai tuorli e mescolare.',
                    'Montare gli albumi a neve con il restante zucchero e unirli delicatamente alla crema.',
                    'Inzuppare i savoiardi nel caffè e creare uno strato in una pirofila.',
                    'Coprire con uno strato di crema. Ripetere fino a esaurimento ingredienti. Spolverare con cacao.'
                ]
            }
        ];

        const CATEGORIES = ['Antipasti', 'Primi Piatti', 'Secondi Piatti', 'Contorni', 'Dolci', 'Bevande', 'Altro'];

        // Oggetto Applicazione Principale
        const app = {
            recipes: JSON.parse(localStorage.getItem('myRecipes')) || INITIAL_RECIPES,
            view: 'list', // list, detail, form
            currentRecipe: null,
            searchTerm: '',
            selectedCategory: 'Tutti',
            
            // Stato del Form temporaneo
            formData: {
                id: null,
                name: '',
                category: 'Primi Piatti',
                prepTime: '',
                ingredients: [''],
                steps: ['']
            },

            init() {
                this.render();
            },

            saveToStorage() {
                localStorage.setItem('myRecipes', JSON.stringify(this.recipes));
            },

            setView(viewName, recipe = null) {
                this.view = viewName;
                if (viewName === 'form') {
                    // Reset o popola il form data
                    if (recipe) {
                        this.formData = JSON.parse(JSON.stringify(recipe)); // Deep copy
                        this.currentRecipe = recipe;
                    } else {
                        this.formData = {
                            id: null,
                            name: '',
                            category: 'Primi Piatti',
                            prepTime: '',
                            ingredients: [''],
                            steps: ['']
                        };
                        this.currentRecipe = null;
                    }
                } else if (viewName === 'detail') {
                    this.currentRecipe = recipe;
                }
                this.render();
                window.scrollTo(0, 0);
            },

            deleteRecipe(id) {
                if (confirm('Sei sicuro di voler eliminare questa ricetta?')) {
                    this.recipes = this.recipes.filter(r => r.id !== id);
                    this.saveToStorage();
                    this.setView('list');
                }
            },

            saveRecipe(e) {
                e.preventDefault();
                
                // Validazione base
                if (!this.formData.name.trim()) {
                    alert('Inserisci il nome della ricetta');
                    return;
                }

                // Pulizia dati
                const cleanData = {
                    ...this.formData,
                    ingredients: this.formData.ingredients.filter(i => i.trim() !== ''),
                    steps: this.formData.steps.filter(s => s.trim() !== '')
                };

                if (cleanData.id) {
                    this.recipes = this.recipes.map(r => r.id === cleanData.id ? cleanData : r);
                } else {
                    cleanData.id = Date.now();
                    this.recipes = [...this.recipes, cleanData];
                }

                this.saveToStorage();
                this.setView('list');
            },

            // --- Metodi Gestione Form ---
            updateFormData(field, value) {
                this.formData[field] = value;
            },

            updateFormArray(field, index, value) {
                this.formData[field][index] = value;
            },

            addFormItem(field) {
                this.formData[field].push('');
                this.render(); // Rerender per mostrare il nuovo campo
            },

            removeFormItem(field, index) {
                if (this.formData[field].length > 1) {
                    this.formData[field].splice(index, 1);
                    this.render();
                }
            },

            // --- Gestione Filtri ---
            setSearchTerm(term) {
                this.searchTerm = term;
                this.renderListContent(); // Re-render solo della griglia
            },

            setCategory(cat) {
                this.selectedCategory = cat;
                this.renderListContent();
            },

            // --- Rendering ---
            render() {
                const root = document.getElementById('app-root');
                const headerActions = document.getElementById('header-actions');
                
                // Pulisci Header Actions
                headerActions.innerHTML = '';
                if (this.view === 'list') {
                    headerActions.innerHTML = `
                        <button onclick="app.setView('form')" class="bg-orange-600 hover:bg-orange-700 text-white px-4 py-2 rounded-full flex items-center gap-2 transition-colors shadow-md active:scale-95">
                            <i data-lucide="plus" width="20" height="20"></i>
                            <span class="font-medium">Nuova Ricetta</span>
                        </button>
                    `;
                }

                // Render Main Content
                if (this.view === 'list') {
                    root.innerHTML = this.getListViewHTML();
                    // Aggiungi listener per search e select dopo averli inseriti nel DOM
                    document.getElementById('search-input').addEventListener('input', (e) => this.setSearchTerm(e.target.value));
                    document.getElementById('category-select').addEventListener('change', (e) => this.setCategory(e.target.value));
                    // Focus fix
                    const searchInput = document.getElementById('search-input');
                    searchInput.value = this.searchTerm;
                    searchInput.focus();
                } else if (this.view === 'detail') {
                    root.innerHTML = this.getDetailViewHTML();
                } else if (this.view === 'form') {
                    root.innerHTML = this.getFormViewHTML();
                }

                // Inizializza icone Lucide
                lucide.createIcons();
            },

            renderListContent() {
                const gridContainer = document.getElementById('recipes-grid');
                if (gridContainer) {
                    gridContainer.innerHTML = this.getRecipeGridHTML();
                    lucide.createIcons();
                }
            },

            // --- HTML Generators ---
            getListViewHTML() {
                return `
                    <div class="animate-fade-in">
                        <!-- Search & Filter Bar -->
                        <div class="mb-8 space-y-4 sm:space-y-0 sm:flex sm:gap-4">
                            <div class="relative flex-1">
                                <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400" width="20" height="20"></i>
                                <input 
                                    id="search-input"
                                    type="text" 
                                    placeholder="Cerca una ricetta..." 
                                    class="w-full pl-10 pr-4 py-3 rounded-xl border border-orange-200 focus:outline-none focus:ring-2 focus:ring-orange-500 bg-white shadow-sm"
                                    value="${this.searchTerm}"
                                >
                            </div>
                            <select 
                                id="category-select"
                                class="w-full sm:w-48 p-3 rounded-xl border border-orange-200 focus:outline-none focus:ring-2 focus:ring-orange-500 bg-white shadow-sm cursor-pointer"
                            >
                                <option value="Tutti" ${this.selectedCategory === 'Tutti' ? 'selected' : ''}>Tutte le Categorie</option>
                                ${CATEGORIES.map(cat => `<option value="${cat}" ${this.selectedCategory === cat ? 'selected' : ''}>${cat}</option>`).join('')}
                            </select>
                        </div>

                        <!-- Recipe Grid -->
                        <div id="recipes-grid">
                            ${this.getRecipeGridHTML()}
                        </div>
                    </div>
                `;
            },

            getRecipeGridHTML() {
                const filtered = this.recipes.filter(r => {
                    const matchesSearch = r.name.toLowerCase().includes(this.searchTerm.toLowerCase());
                    const matchesCategory = this.selectedCategory === 'Tutti' || r.category === this.selectedCategory;
                    return matchesSearch && matchesCategory;
                });

                if (filtered.length === 0) {
                    return `
                        <div class="text-center py-20 opacity-60">
                            <div class="mx-auto mb-4 text-orange-300 flex justify-center">
                                <i data-lucide="utensils" width="64" height="64"></i>
                            </div>
                            <p class="text-xl font-medium text-gray-500">Nessuna ricetta trovata.</p>
                            <p class="text-gray-400">Prova a cambiare i filtri o aggiungi una nuova ricetta.</p>
                        </div>
                    `;
                }

                return `
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                        ${filtered.map(recipe => `
                            <div 
                                onclick="app.setView('detail', app.recipes.find(r => r.id === ${recipe.id}))"
                                class="bg-white rounded-2xl shadow-sm hover:shadow-md border border-orange-100 overflow-hidden cursor-pointer transition-all hover:-translate-y-1 group"
                            >
                                <div class="h-32 bg-orange-100 flex items-center justify-center relative overflow-hidden">
                                    <div class="text-orange-300 opacity-50 group-hover:scale-110 transition-transform duration-500">
                                        <i data-lucide="chef-hat" width="64" height="64"></i>
                                    </div>
                                    <div class="absolute top-3 right-3 bg-white/90 backdrop-blur-sm px-2 py-1 rounded-md text-xs font-bold text-orange-600 shadow-sm">
                                        ${recipe.category}
                                    </div>
                                </div>
                                <div class="p-5">
                                    <h3 class="text-lg font-bold text-gray-800 mb-2 line-clamp-1">${recipe.name}</h3>
                                    <div class="flex items-center text-sm text-gray-500 gap-4">
                                        <div class="flex items-center gap-1">
                                            <i data-lucide="clock" width="16" height="16"></i>
                                            <span>${recipe.prepTime}</span>
                                        </div>
                                        <div class="flex items-center gap-1">
                                            <i data-lucide="list" width="16" height="16"></i>
                                            <span>${recipe.ingredients.length} ingr.</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
            },

            getDetailViewHTML() {
                const r = this.currentRecipe;
                return `
                    <div class="bg-white rounded-3xl shadow-lg border border-orange-100 overflow-hidden max-w-4xl mx-auto animate-fade-in-up">
                        <!-- Detail Header -->
                        <div class="bg-gradient-to-r from-orange-500 to-red-500 p-6 text-white">
                            <button onclick="app.setView('list')" class="flex items-center gap-1 text-white/80 hover:text-white mb-6 transition-colors">
                                <i data-lucide="chevron-left" width="20" height="20"></i> Torna all'elenco
                            </button>
                            <div class="flex flex-col md:flex-row md:items-end justify-between gap-4">
                                <div>
                                    <span class="bg-white/20 px-3 py-1 rounded-full text-sm font-medium backdrop-blur-md">
                                        ${r.category}
                                    </span>
                                    <h2 class="text-3xl md:text-4xl font-bold mt-3">${r.name}</h2>
                                    <div class="flex items-center gap-2 mt-2 opacity-90">
                                        <i data-lucide="clock" width="20" height="20"></i>
                                        <span class="text-lg">${r.prepTime}</span>
                                    </div>
                                </div>
                                <div class="flex gap-2">
                                    <button 
                                        onclick="app.setView('form', app.currentRecipe)"
                                        class="bg-white/20 hover:bg-white/30 p-3 rounded-full backdrop-blur-md transition-colors"
                                        title="Modifica"
                                    >
                                        <i data-lucide="edit-2" width="20" height="20"></i>
                                    </button>
                                    <button 
                                        onclick="app.deleteRecipe(${r.id})"
                                        class="bg-white/20 hover:bg-red-600/50 p-3 rounded-full backdrop-blur-md transition-colors"
                                        title="Elimina"
                                    >
                                        <i data-lucide="trash-2" width="20" height="20"></i>
                                    </button>
                                </div>
                            </div>
                        </div>

                        <div class="grid md:grid-cols-3 gap-8 p-6 md:p-8">
                            <!-- Ingredients Column -->
                            <div class="md:col-span-1 space-y-6">
                                <div class="bg-orange-50 p-6 rounded-2xl">
                                    <h3 class="text-xl font-bold text-orange-900 flex items-center gap-2 mb-4">
                                        <i data-lucide="utensils" width="20" height="20"></i> Ingredienti
                                    </h3>
                                    <ul class="space-y-3">
                                        ${r.ingredients.map(ing => `
                                            <li class="flex items-start gap-3 text-gray-700">
                                                <div class="min-w-[6px] h-[6px] rounded-full bg-orange-400 mt-2"></div>
                                                <span class="leading-relaxed">${ing}</span>
                                            </li>
                                        `).join('')}
                                    </ul>
                                </div>
                            </div>

                            <!-- Steps Column -->
                            <div class="md:col-span-2">
                                <h3 class="text-xl font-bold text-gray-800 flex items-center gap-2 mb-6 border-b pb-2">
                                    <i data-lucide="book-open" class="text-orange-500" width="20" height="20"></i> Procedimento
                                </h3>
                                <div class="space-y-8">
                                    ${r.steps.map((step, idx) => `
                                        <div class="flex gap-4">
                                            <div class="flex-shrink-0 w-8 h-8 rounded-full bg-orange-100 text-orange-600 font-bold flex items-center justify-center border border-orange-200">
                                                ${idx + 1}
                                            </div>
                                            <p class="text-gray-700 leading-relaxed pt-1 text-lg">
                                                ${step}
                                            </p>
                                        </div>
                                    `).join('')}
                                </div>
                                
                                <div class="mt-12 flex items-center justify-center p-6 bg-green-50 rounded-xl border border-green-100 text-green-800">
                                    <i data-lucide="check-circle" class="mr-2" width="24" height="24"></i>
                                    <span class="font-semibold">Buon Appetito!</span>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            },

            getFormViewHTML() {
                return `
                    <div class="bg-white rounded-2xl shadow-lg border border-orange-100 max-w-3xl mx-auto p-6 md:p-8 animate-fade-in-up">
                        <div class="flex justify-between items-center mb-6 border-b pb-4">
                            <h2 class="text-2xl font-bold text-gray-800">
                                ${this.formData.id ? 'Modifica Ricetta' : 'Nuova Ricetta'}
                            </h2>
                            <button onclick="app.setView('list')" class="p-2 hover:bg-gray-100 rounded-full text-gray-500">
                                <i data-lucide="x" width="24" height="24"></i>
                            </button>
                        </div>

                        <form onsubmit="app.saveRecipe(event)" class="space-y-6">
                            <div class="grid md:grid-cols-2 gap-6">
                                <div class="space-y-2">
                                    <label class="text-sm font-semibold text-gray-600">Nome Ricetta</label>
                                    <input 
                                        required
                                        type="text" 
                                        class="w-full p-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-orange-500 focus:border-orange-500 outline-none transition-shadow"
                                        placeholder="Es. Pasta al Pomodoro"
                                        value="${this.formData.name}"
                                        oninput="app.updateFormData('name', this.value)"
                                    >
                                </div>
                                
                                <div class="space-y-2">
                                    <label class="text-sm font-semibold text-gray-600">Categoria</label>
                                    <select 
                                        class="w-full p-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-orange-500 outline-none"
                                        onchange="app.updateFormData('category', this.value)"
                                    >
                                        ${CATEGORIES.map(cat => `
                                            <option value="${cat}" ${this.formData.category === cat ? 'selected' : ''}>${cat}</option>
                                        `).join('')}
                                    </select>
                                </div>

                                <div class="space-y-2 md:col-span-2">
                                    <label class="text-sm font-semibold text-gray-600">Tempo di Preparazione</label>
                                    <div class="relative">
                                        <i data-lucide="clock" class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400" width="18" height="18"></i>
                                        <input 
                                            type="text" 
                                            class="w-full pl-10 pr-3 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-orange-500 outline-none"
                                            placeholder="Es. 30 minuti, 1 ora e mezza..."
                                            value="${this.formData.prepTime}"
                                            oninput="app.updateFormData('prepTime', this.value)"
                                        >
                                    </div>
                                </div>
                            </div>

                            <!-- Dynamic Ingredients -->
                            <div class="space-y-3 pt-4">
                                <label class="text-sm font-semibold text-gray-600 flex justify-between items-center">
                                    Ingredienti
                                    <span class="text-xs font-normal text-gray-400">Non lasciare campi vuoti</span>
                                </label>
                                ${this.formData.ingredients.map((ing, idx) => `
                                    <div class="flex gap-2">
                                        <input 
                                            type="text" 
                                            class="flex-1 p-2 rounded-lg border border-gray-300 focus:border-orange-500 outline-none"
                                            placeholder="Ingrediente ${idx + 1}"
                                            value="${ing}"
                                            oninput="app.updateFormArray('ingredients', ${idx}, this.value)"
                                        >
                                        <button 
                                            type="button" 
                                            onclick="app.removeFormItem('ingredients', ${idx})"
                                            class="p-2 text-red-400 hover:text-red-600 hover:bg-red-50 rounded-lg disabled:opacity-30"
                                            ${this.formData.ingredients.length === 1 ? 'disabled' : ''}
                                        >
                                            <i data-lucide="trash-2" width="18" height="18"></i>
                                        </button>
                                    </div>
                                `).join('')}
                                <button 
                                    type="button"
                                    onclick="app.addFormItem('ingredients')"
                                    class="text-sm text-orange-600 font-medium hover:text-orange-700 flex items-center gap-1 mt-2"
                                >
                                    <i data-lucide="plus" width="16" height="16"></i> Aggiungi Ingrediente
                                </button>
                            </div>

                            <!-- Dynamic Steps -->
                            <div class="space-y-3 pt-4 border-t">
                                <label class="text-sm font-semibold text-gray-600">Procedimento</label>
                                ${this.formData.steps.map((step, idx) => `
                                    <div class="flex gap-2 items-start">
                                        <span class="mt-3 text-sm font-bold text-orange-400 w-5">${idx + 1}.</span>
                                        <textarea 
                                            class="flex-1 p-3 rounded-lg border border-gray-300 focus:border-orange-500 outline-none min-h-[80px]"
                                            placeholder="Descrivi il passaggio ${idx + 1}..."
                                            oninput="app.updateFormArray('steps', ${idx}, this.value)"
                                        >${step}</textarea>
                                        <button 
                                            type="button" 
                                            onclick="app.removeFormItem('steps', ${idx})"
                                            class="mt-2 p-2 text-red-400 hover:text-red-600 hover:bg-red-50 rounded-lg disabled:opacity-30"
                                            ${this.formData.steps.length === 1 ? 'disabled' : ''}
                                        >
                                            <i data-lucide="trash-2" width="18" height="18"></i>
                                        </button>
                                    </div>
                                `).join('')}
                                <button 
                                    type="button"
                                    onclick="app.addFormItem('steps')"
                                    class="text-sm text-orange-600 font-medium hover:text-orange-700 flex items-center gap-1 mt-2"
                                >
                                    <i data-lucide="plus" width="16" height="16"></i> Aggiungi Passaggio
                                </button>
                            </div>

                            <div class="pt-6 border-t flex gap-4 justify-end">
                                <button 
                                    type="button" 
                                    onclick="app.setView('list')"
                                    class="px-6 py-3 rounded-xl border border-gray-300 text-gray-700 font-medium hover:bg-gray-50 transition-colors"
                                >
                                    Annulla
                                </button>
                                <button 
                                    type="submit"
                                    class="px-8 py-3 rounded-xl bg-orange-600 text-white font-bold hover:bg-orange-700 shadow-lg shadow-orange-200 transition-all active:scale-95 flex items-center gap-2"
                                >
                                    <i data-lucide="save" width="20" height="20"></i> Salva Ricetta
                                </button>
                            </div>
                        </form>
                    </div>
                `;
            }
        };

        // Avvio Applicazione
        app.init();
    </script>
</body>
</html>ricetta
